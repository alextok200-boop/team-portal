name: 钉钉日报数据抓取

on:
  schedule:
    # ⚠️ cron 是 UTC；中国不实行夏令时，UTC+8 恒定，所以这里不存在时区漂移。
    # UTC 03:00 = 北京时间 11:00（抓当天上午录入）
    - cron: '0 3 * * *'
    # UTC 09:00 = 北京时间 17:00（抓当天下午录入）
    - cron: '0 9 * * *'
    # ⚠️ GitHub 明确说明：schedule 事件在负载高峰会延迟，而「整点」正是最拥堵的时段
    #    （原文：delayed during periods of high loads… high load times include the start of every hour）。
    #    所以这两个任务实际多半会在 11:0x–11:2x / 17:0x–17:2x 之间跑完，偶尔可能被跳过。
    #    若哪天需要「必须准点」，把分钟错开到 :50（如 10:50 / 16:50）比整点更靠谱。
  workflow_dispatch:
    inputs:
      row_cap:
        description: '扫描行数上限 rawCap（留空/0 用默认 20000，分店铺表另有 16000/24000）'
        required: false
        default: ''

# 同一时刻只跑一个抓取，避免两次提交撞车
concurrency:
  group: fetch-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 9 张表全量扫描约 2.4 万行 = 约 240 次分页请求，实测约 4~5 分钟；
    # 留足余量应对表继续变长（默认 rawCap 已提到 20000）。
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取钉钉 AI 表格数据
        env:
          DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
          DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
          DINGTALK_OPERATOR_ID: ${{ secrets.DINGTALK_OPERATOR_ID }}
          DINGTALK_BASE_ID: ${{ secrets.DINGTALK_BASE_ID }}
          DINGTALK_RAW_CAP: ${{ github.event.inputs.row_cap }}
        run: node scripts/fetch-openapi.js

      - name: 提交数据（若有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新日报数据 $(TZ=Asia/Shanghai date +%F\ %H:%M)"
          # 远端可能已被其它推送（含人工 API 推送）推进，先 rebase 再推
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
          git push
