<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/team-portal/">
<script>(function(){var p=location.pathname,i=p.indexOf("/pages/");var b=i!==-1?p.slice(0,i+1):p.slice(0,p.lastIndexOf("/")+1);window.SITE_BASE=b;window.Site={url:function(x){return b+String(x||"").replace(/^\//,"")},strip:function(x){var s=String(x||"");if(b!=="/"&&s.indexOf(b)===0)s=s.slice(b.length-1);return s}}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录日志 · 团队门户</title>
<link rel="stylesheet" href="css/portal.css?v=2.2.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2.0.0">
</head>
<body>

<main class="portal-main">
  <h1 class="page-title">登录日志</h1>
  <p class="page-sub">本机登录审计 · 成功与失败记录</p>

  <div class="notice">
    <strong>权限要求：</strong>仅管理员
  </div>

  <div class="notice">
    <strong>说明：</strong>服务端记录全部账号的登录尝试（成功与失败）及管理操作，最多保留 300 条。
  </div>

  <div class="toolbar">
    <button class="btn btn-ghost" id="btnRefresh">刷新</button>
    <button class="btn btn-ghost" id="btnClear">清空日志</button>
    <span class="muted" id="logMeta"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>时间</th><th>账号</th><th>姓名</th><th>角色</th><th>结果</th><th>说明</th><th>IP</th></tr></thead>
      <tbody id="logTable"><tr><td colspan="7" class="loading">加载中…</td></tr></tbody>
    </table>
  </div>


</main>

<script src="js/config/roles.js?v=2.0.0"></script>
<script src="js/api.js?v=2.0.0"></script>
<script src="js/auth.js?v=2.0.0"></script>
<script src="js/portal.js?v=2.0.0"></script>
<script>
(function () {
  function refresh() {
    API.get('/api/logs').then(function (res) {
      var tb = document.getElementById('logTable');
      if (!res.ok) { tb.innerHTML = '<tr><td colspan="7" class="loading">' + Portal.esc(res.error || '加载失败') + '</td></tr>'; return; }
      var logs = res.logs || [];
      document.getElementById('logMeta').textContent = '共 ' + logs.length + ' 条（保留最近 300 条）';
      if (!logs.length) { tb.innerHTML = '<tr><td colspan="7" class="loading">暂无记录</td></tr>'; return; }
      tb.innerHTML = logs.map(function (l) {
        return '<tr>' +
          '<td class="mono muted">' + Portal.esc(Portal.fmtTime(l.time)) + '</td>' +
          '<td class="mono">' + Portal.esc(l.username) + '</td>' +
          '<td>' + Portal.esc(l.name) + '</td>' +
          '<td>' + Portal.esc(l.role) + '</td>' +
          '<td>' + (l.ok ? '<span class="tag tag-green">成功</span>' : '<span class="tag tag-pink">失败</span>') + '</td>' +
          '<td class="muted">' + Portal.esc(l.reason || '') + '</td>' +
          '<td class="mono muted">' + Portal.esc(l.ip || '-') + '</td>' +
        '</tr>';
      }).join('');
    });
  }

  Portal.boot({ title: '团队门户', roles: ['admin'] }).then(function (u) {
    if (!u) return;
    document.getElementById('btnRefresh').addEventListener('click', refresh);
    document.getElementById('btnClear').addEventListener('click', function () {
      if (!confirm('确定清空所有登录日志？')) return;
      API.del('/api/logs').then(function (res) {
        if (!res.ok) return Portal.toast(res.error || '清空失败', 'error');
        Portal.toast('已清空'); refresh();
      });
    });
    refresh();
  });
})();
</script>

</body>
</html>
