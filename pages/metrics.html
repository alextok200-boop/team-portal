<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="/team-portal/">
<script>(function(){var p=location.pathname,i=p.indexOf("/pages/");var b=i!==-1?p.slice(0,i+1):p.slice(0,p.lastIndexOf("/")+1);window.SITE_BASE=b;window.Site={url:function(x){return b+String(x||"").replace(/^\//,"")},strip:function(x){var s=String(x||"");if(b!=="/"&&s.indexOf(b)===0)s=s.slice(b.length-1);return s}}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据指标 · 团队门户</title>
<link rel="stylesheet" href="css/portal.css?v=2.0.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2.0.0">
</head>
<body>

<main class="portal-main">
  <h1 class="page-title">数据指标</h1>
  <p class="page-sub">核心指标 · 趋势分析 · 环比对比</p>

  <div class="notice">
    <strong>权限要求：</strong>管理员、团队主管
  </div>

  <div class="stats">
    <div class="stat"><div class="label">指标 A</div><div class="value">—</div></div>
    <div class="stat"><div class="label">指标 B</div><div class="value">—</div></div>
    <div class="stat"><div class="label">指标 C</div><div class="value">—</div></div>
    <div class="stat"><div class="label">指标 D</div><div class="value">—</div></div>
  </div>

  <div class="notice">
    <strong>说明：</strong>当前为示例占位数据。接入真实数据源后替换此处的取数逻辑即可。
  </div>

  <h2 style="font-size:17px;margin:8px 0 14px">指标明细</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>指标</th><th>本期</th><th>上期</th><th>环比</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td>指标 A</td><td>—</td><td>—</td><td>—</td><td><span class="tag tag-green">正常</span></td></tr>
        <tr><td>指标 B</td><td>—</td><td>—</td><td>—</td><td><span class="tag tag-green">正常</span></td></tr>
        <tr><td>指标 C</td><td>—</td><td>—</td><td>—</td><td><span class="tag tag-blue">观察</span></td></tr>
        <tr><td>指标 D</td><td>—</td><td>—</td><td>—</td><td><span class="tag tag-pink">待补</span></td></tr>
      </tbody>
    </table>
  </div>


</main>

<script src="js/config/roles.js?v=2.0.0"></script>
<script src="js/api.js?v=2.0.0"></script>
<script src="js/auth.js?v=2.0.0"></script>
<script src="js/portal.js?v=2.0.0"></script>
<script>
(function () {
  Portal.boot({ title: '团队门户', roles: ['admin', 'team_leader'] }).then(function (u) {
    if (!u) return;
    /* 接入数据源后在此渲染指标：可从 /api/data/daily 聚合 */
  });
})();
</script>

</body>
</html>
